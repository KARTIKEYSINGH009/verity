[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.2.0"
description = "Verity — AI firewall: eval, guardrails, observability for LLM apps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["verity*"]

# Vercel: where the FastAPI app lives (fixes FASTAPI_ENTRYPOINT_NOT_FOUND).
[tool.vercel]
entrypoint = "verity.gateway:app"
