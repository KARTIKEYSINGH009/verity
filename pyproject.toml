[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.2.0"
description = "Verity — AI firewall: eval, guardrails, observability for LLM apps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
include = ["verity*"]

# Vercel, red-team-console branch only: do NOT set a gateway entrypoint
# here. This branch deploys the console as a serverless function in
# api/index.py (see vercel.json). The gateway entrypoint lives on main
# and serves the separate verity project, so restoring it here makes
# Vercel serve the gateway instead of the console.
